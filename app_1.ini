; config/php/app.ini - your settings on top of PHP 8.4's php.ini-production.
; Move over only the values you deliberately changed in the old 5.6 php.ini.

; Include path carried over from the old 5.6 php.ini - code includes files like
; 'cfg/db.php' and 'main/functions.php' relative to these directories
include_path = ".:/usr/local/etc/php:/var/www/html:/var/www/html/Reports:/var/www/cgi-bin"

; Helpers for the converted mysql_* code (mysql_compat_connect, mysql_compat_error, ...)
auto_prepend_file = /var/www/mysql_compat.php

; While testing the migration: log EVERYTHING, including deprecations
; (php.ini-production hides E_DEPRECATED). Use the second line in production.
error_reporting = E_ALL
; error_reporting = E_ALL & ~E_DEPRECATED

; Timezone (match the container TZ)
date.timezone = Europe/Stockholm

; Limits - adjust to what the app needs
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 16M
max_execution_time = 60

; Errors: log, don't display
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Session hardening
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
; session.cookie_secure = 1        ; enable if the app is served over HTTPS
session.upload_progress.enabled = 0  ; keep off unless the app shows upload progress bars

; php.ini-production turns short_open_tag Off, so files using "<?" instead of "<?php" would
; print their source code. php_mysql_convert.py converts them; until you've run it, uncomment:
; short_open_tag = On

; Don't advertise the PHP version in response headers
expose_php = Off
